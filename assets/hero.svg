<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="430" viewBox="0 0 1200 430" role="img" aria-labelledby="title desc">
  <title id="title">Jordy Retana — Full Stack Developer</title>
  <desc id="desc">Responsive animated developer profile banner</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#020617"/><stop offset="0.5" stop-color="#0f172a"/><stop offset="1" stop-color="#111827"/></linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#22d3ee"/><stop offset="0.5" stop-color="#8b5cf6"/><stop offset="1" stop-color="#f59e0b"/></linearGradient>
    <filter id="glow"><feGaussianBlur stdDeviation="6" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <clipPath id="clip"><rect width="1200" height="430" rx="34"/></clipPath>
  </defs>
  <g clip-path="url(#clip)">
    <rect width="1200" height="430" fill="url(#bg)"/>
    <circle cx="110" cy="90" r="160" fill="#0ea5e9" opacity="0.08"><animate attributeName="r" values="145;190;145" dur="7s" repeatCount="indefinite"/></circle>
    <circle cx="1080" cy="330" r="180" fill="#7c3aed" opacity="0.10"><animate attributeName="r" values="165;215;165" dur="8s" repeatCount="indefinite"/></circle>
    <g opacity="0.18" stroke="#334155"><path d="M0 86H1200M0 172H1200M0 258H1200M0 344H1200"/><path d="M120 0V430M240 0V430M360 0V430M480 0V430M600 0V430M720 0V430M840 0V430M960 0V430M1080 0V430"/></g>
    <g font-family="ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,monospace">
      <text x="72" y="76" fill="#67e8f9" font-size="18">~/profile</text>
      <text x="72" y="150" fill="#f8fafc" font-size="52" font-weight="800">JORDY RETANA</text>
      <rect x="72" y="170" width="520" height="5" rx="3" fill="url(#accent)"><animate attributeName="width" values="180;520;430;520" dur="5.5s" repeatCount="indefinite"/></rect>
      <text x="72" y="220" fill="#cbd5e1" font-size="22">FULL-STACK DEVELOPER • COSTA RICA</text>
      <text x="72" y="260" fill="#94a3b8" font-size="17">Frontend • Backend • Cloud • UI/UX • Automation • Interactive Tech</text>
      <g transform="translate(790 92)">
        <rect width="330" height="220" rx="22" fill="#020617" stroke="#334155" stroke-width="2"/>
        <circle cx="28" cy="26" r="6" fill="#ef4444"/><circle cx="50" cy="26" r="6" fill="#f59e0b"/><circle cx="72" cy="26" r="6" fill="#22c55e"/>
        <text x="26" y="76" fill="#22d3ee" font-size="16">$ whoami</text>
        <text x="26" y="108" fill="#e2e8f0" font-size="16">jordy@dev</text>
        <text x="26" y="150" fill="#a78bfa" font-size="16">$ status</text>
        <text x="26" y="182" fill="#f8fafc" font-size="16">building polished software</text>
        <rect x="258" y="168" width="10" height="18" fill="#22d3ee"><animate attributeName="opacity" values="1;0;1" dur="1s" repeatCount="indefinite"/></rect>
      </g>
      <g transform="translate(72 320)"><rect width="650" height="54" rx="16" fill="#0b1220" stroke="#1e293b"/><text x="24" y="34" fill="#94a3b8" font-size="15">build → polish → simplify → ship → learn → repeat</text></g>
    </g>
    <circle cx="700" cy="64" r="3" fill="#22d3ee" filter="url(#glow)"><animate attributeName="cx" values="660;745;660" dur="4s" repeatCount="indefinite"/><animate attributeName="opacity" values="0.25;1;0.25" dur="4s" repeatCount="indefinite"/></circle>
  </g>
</svg>