<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc">
  <title id="title">Jordy Retana — Full Stack Developer</title>
  <desc id="desc">Animated developer profile banner</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#020617"/>
      <stop offset="0.48" stop-color="#0f172a"/>
      <stop offset="1" stop-color="#111827"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22d3ee"/>
      <stop offset="0.5" stop-color="#8b5cf6"/>
      <stop offset="1" stop-color="#f59e0b"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="7" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="clip"><rect width="1200" height="360" rx="34"/></clipPath>
  </defs>

  <g clip-path="url(#clip)">
    <rect width="1200" height="360" fill="url(#bg)"/>
    <circle cx="130" cy="90" r="170" fill="#0ea5e9" opacity="0.08">
      <animate attributeName="r" values="150;205;150" dur="7s" repeatCount="indefinite"/>
    </circle>
    <circle cx="1080" cy="280" r="190" fill="#7c3aed" opacity="0.10">
      <animate attributeName="r" values="170;225;170" dur="8s" repeatCount="indefinite"/>
    </circle>

    <g opacity="0.22">
      <path d="M0 70H1200M0 140H1200M0 210H1200M0 280H1200" stroke="#334155"/>
      <path d="M120 0V360M240 0V360M360 0V360M480 0V360M600 0V360M720 0V360M840 0V360M960 0V360M1080 0V360" stroke="#334155"/>
    </g>

    <g font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace">
      <text x="78" y="72" fill="#67e8f9" font-size="20">~/profile</text>
      <text x="78" y="135" fill="#f8fafc" font-size="54" font-weight="800">JORDY RETANA</text>
      <rect x="78" y="154" width="520" height="5" rx="3" fill="url(#accent)">
        <animate attributeName="width" values="120;520;400;520" dur="5s" repeatCount="indefinite"/>
      </rect>
      <text x="78" y="205" fill="#cbd5e1" font-size="24">FULL-STACK DEVELOPER • COSTA RICA</text>
      <text x="78" y="250" fill="#94a3b8" font-size="19">Frontend  •  Backend  •  Cloud  •  UI/UX  •  Interactive Tech</text>

      <g transform="translate(835 82)">
        <rect width="285" height="196" rx="18" fill="#020617" stroke="#334155"/>
        <circle cx="24" cy="22" r="5" fill="#ef4444"/>
        <circle cx="42" cy="22" r="5" fill="#f59e0b"/>
        <circle cx="60" cy="22" r="5" fill="#22c55e"/>
        <text x="22" y="62" fill="#22d3ee" font-size="15">$ whoami</text>
        <text x="22" y="91" fill="#e2e8f0" font-size="15">jordy@dev</text>
        <text x="22" y="128" fill="#a78bfa" font-size="15">$ status</text>
        <text x="22" y="157" fill="#f8fafc" font-size="15">building cool stuff</text>
        <rect x="213" y="145" width="10" height="18" fill="#22d3ee">
          <animate attributeName="opacity" values="1;0;1" dur="1s" repeatCount="indefinite"/>
        </rect>
      </g>
    </g>

    <circle cx="760" cy="64" r="3" fill="#22d3ee" filter="url(#glow)">
      <animate attributeName="cx" values="700;790;700" dur="4s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.2;1;0.2" dur="4s" repeatCount="indefinite"/>
    </circle>
  </g>
</svg>