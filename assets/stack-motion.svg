<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="460" viewBox="0 0 1200 460" role="img" aria-labelledby="t d">
<title id="t">Animated technology stack</title><desc id="d">Animated technology pipeline with separated labels and larger spacing</desc>
<defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#020617"/><stop offset="1" stop-color="#101827"/></linearGradient><linearGradient id="line" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#22d3ee"/><stop offset=".5" stop-color="#8b5cf6"/><stop offset="1" stop-color="#f59e0b"/></linearGradient><filter id="glow"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs>
<rect width="1200" height="460" rx="30" fill="url(#bg)"/>
<g font-family="ui-monospace,Menlo,Consolas,monospace"><text x="60" y="60" fill="#67e8f9" font-size="18">stack.pipeline()</text><text x="60" y="90" fill="#64748b" font-size="13">languages → interfaces → backend → data/cloud → creative</text></g>
<path d="M120 235H1080" stroke="#233044" stroke-width="5" stroke-linecap="round"/><path d="M120 235H1080" stroke="url(#line)" stroke-width="5" stroke-linecap="round" stroke-dasharray="100 72"><animate attributeName="stroke-dashoffset" values="0;-344" dur="6s" repeatCount="indefinite"/></path>
<g font-family="ui-monospace,Menlo,Consolas,monospace" text-anchor="middle">
  <g transform="translate(150 235)"><circle r="58" fill="#071827" stroke="#22d3ee" stroke-width="2"/><text y="-8" fill="#e2e8f0" font-size="16" font-weight="700">JS / TS</text><text y="20" fill="#94a3b8" font-size="12">LANGUAGES</text><animateTransform attributeName="transform" type="translate" values="150 235;150 223;150 235" dur="3.2s" repeatCount="indefinite"/></g>
  <g transform="translate(375 235)"><circle r="58" fill="#11162b" stroke="#818cf8" stroke-width="2"/><text y="-8" fill="#e2e8f0" font-size="16" font-weight="700">REACT</text><text y="20" fill="#94a3b8" font-size="12">FRONTEND</text><animateTransform attributeName="transform" type="translate" values="375 235;375 247;375 235" dur="3.6s" repeatCount="indefinite"/></g>
  <g transform="translate(600 235)"><circle r="66" fill="#171126" stroke="#a78bfa" stroke-width="2"/><text y="-10" fill="#f8fafc" font-size="16" font-weight="700">NODE / .NET</text><text y="20" fill="#94a3b8" font-size="12">BACKEND</text><animateTransform attributeName="transform" type="translate" values="600 235;600 221;600 235" dur="4s" repeatCount="indefinite"/></g>
  <g transform="translate(825 235)"><circle r="58" fill="#211806" stroke="#f59e0b" stroke-width="2"/><text y="-8" fill="#f8fafc" font-size="16" font-weight="700">DB / GCP</text><text y="20" fill="#94a3b8" font-size="12">DATA + CLOUD</text><animateTransform attributeName="transform" type="translate" values="825 235;825 247;825 235" dur="4.4s" repeatCount="indefinite"/></g>
  <g transform="translate(1050 235)"><circle r="58" fill="#22120f" stroke="#fb7185" stroke-width="2"/><text y="-8" fill="#f8fafc" font-size="15" font-weight="700">UNITY / 3D</text><text y="20" fill="#94a3b8" font-size="12">CREATIVE</text><animateTransform attributeName="transform" type="translate" values="1050 235;1050 222;1050 235" dur="4.8s" repeatCount="indefinite"/></g>
</g>
<g font-family="ui-monospace,Menlo,Consolas,monospace" font-size="13"><g transform="translate(78 356)"><rect width="1044" height="64" rx="18" fill="#0b1220" stroke="#1e293b"/><text x="24" y="26" fill="#cbd5e1">JavaScript · TypeScript · C# · Java · Python · React · Next.js · Node · NestJS · Spring · .NET</text><text x="24" y="48" fill="#94a3b8">MySQL · Oracle · Firebase · GCP · Docker · Linux · Git · Blender · Unity · Unreal</text></g></g>
<circle cx="600" cy="235" r="4" fill="#f8fafc" filter="url(#glow)"><animate attributeName="opacity" values=".2;1;.2" dur="1.8s" repeatCount="indefinite"/></circle>
</svg>