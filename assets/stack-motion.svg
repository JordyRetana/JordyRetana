<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="330" viewBox="0 0 1200 330" role="img" aria-labelledby="t d"><title id="t">Animated technology stack</title><desc id="d">Animated technology labels orbiting through a developer stack</desc><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#020617"/><stop offset="1" stop-color="#101827"/></linearGradient><linearGradient id="line" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#22d3ee"/><stop offset=".5" stop-color="#8b5cf6"/><stop offset="1" stop-color="#f59e0b"/></linearGradient></defs><rect width="1200" height="330" rx="28" fill="url(#bg)"/><g font-family="ui-monospace,Menlo,Consolas,monospace"><text x="58" y="54" fill="#67e8f9" font-size="18">stack.pipeline()</text><text x="58" y="84" fill="#64748b" font-size="13">languages → frameworks → data → cloud → creative</text></g><path d="M92 175H1108" stroke="#233044" stroke-width="4" stroke-linecap="round"/><path d="M92 175H1108" stroke="url(#line)" stroke-width="4" stroke-linecap="round" stroke-dasharray="90 65"><animate attributeName="stroke-dashoffset" values="0;-310" dur="6s" repeatCount="indefinite"/></path><g font-family="ui-monospace,Menlo,Consolas,monospace" text-anchor="middle"><g transform="translate(150 175)"><circle r="48" fill="#071827" stroke="#22d3ee"/><text y="-5" fill="#e2e8f0" font-size="15" font-weight="700">JS / TS</text><text y="18" fill="#94a3b8" font-size="11">LANG</text><animateTransform attributeName="transform" type="translate" values="150 175;150 165;150 175" dur="3s" repeatCount="indefinite"/></g><g transform="translate(370 175)"><circle r="48" fill="#11162b" stroke="#818cf8"/><text y="-5" fill="#e2e8f0" font-size="15" font-weight="700">REACT</text><text y="18" fill="#94a3b8" font-size="11">UI</text><animateTransform attributeName="transform" type="translate" values="370 175;370 183;370 175" dur="3.4s" repeatCount="indefinite"/></g><g transform="translate(600 175)"><circle r="54" fill="#171126" stroke="#a78b