  <g transform="translate(850 125)"><rect width="280" height="130" rx="24" fill="#151127" stroke="#a78bfa" stroke-width="2"/><circle cx="34" cy="34" r="8" fill="#a78bfa"><animate attributeName="r" values="8;11;8" dur="3.5s" repeatCount="indefinite"/></circle><text x="58" y="40" fill="#c4b5fd" font-size="19" font-weight="700">BACKEND</text><text x="28" y="78" fill="#cbd5e1" font-size="14">APIs · auth · business logic</text><text x="28" y="102" fill="#94a3b8" font-size="13">data · validation · architecture</text></g>
  <g transform="translate(70 285)"><rect width="280" height="130" rx="24" fill="#211806" stroke="#f59e0b" stroke-width="2"/><circle cx="34" cy="34" r="8" fill="#f59e0b"><animate attributeName="r" values="7;10;7" dur="4s" repeatCount="indefinite"/></circle><text x="58" y="40" fill="#fbbf24" font-size="19" font-weight="700">CLOUD</text><text x="28" y="78" fill="#cbd5e1" font-size="14">Containers · deployments</text><text x="28" y="102" fill="#94a3b8" font-size="13">automation · reliable workflows</text></g>
  <g transform="translate(850 285)"><rect width="280" height="130" rx="24" fill="#22120f" stroke="#fb7185" stroke-width="2"/><circle cx="34" cy="34" r="8" fill="#fb7185"><animate attributeName="r" values="8;11;8" dur="4.5s" repeatCount="indefinite"/></circle><text x="58" y="40" fill="#fda4af" font-size="19" font-weight="700">CREATIVE TECH</text><text x="28" y="78" fill="#cbd5e1" font-size="14">3D · interactive prototypes</text><text x="28" y="102" fill="#94a3b8" font-size="13">game-inspired digital ideas</text></g>
  <g transform="translate(500 155)"><rect width="200" height="230" rx="34" fill="#0b1220" stroke="url(#g)" stroke-width="3"/><circle cx="100" cy="88" r="52" fill="#0f172a" stroke="#8b5cf6" stroke-width="2"><animate attributeName="r" values="49;55;49" dur="4s" repeatCount="indefinite"/></circle><circle cx="100" cy="88" r="66" fill="none" stroke="url(#g)" stroke-width="2" stroke-dasharray="16 14"><animateTransform attributeName="transform" type="rotate" from="0 100 88" to="360 100 88" dur="13s" repeatCount="indefinite"/></circle><text x="100" y="83" text-anchor="middle" fill="#f8fafc" font-size="21" font-weight="700">JORDY</text><text x="100" y="108" text-anchor="middle" fill="#94a3b8" font-size="12">BUILD SYSTEM</text><text x="100" y="166" text-anchor="middle" fill="#22d3ee" font-size="13">ENGINEERING</text><text x="100" y="190" text-anchor="middle" fill="#a78bfa" font-size="13">PRODUCT</text></g>
