<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" viewBox="0 0 1200 520" role="img" aria-labelledby="t d">
<title id="t">Animated developer capabilities</title><desc id="d">Animated capability cards for frontend backend cloud and creative technology</desc>
<defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#020617"/><stop offset="1" stop-color="#111827"/></linearGradient><linearGradient id="g" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#22d3ee"/><stop offset=".5" stop-color="#8b5cf6"/><stop offset="1" stop-color="#f59e0b"/></linearGradient><filter id="glow"><feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs>
<rect width="1200" height="520" rx="30" fill="url(#bg)"/>
<g font-family="ui-monospace,Menlo,Consolas,monospace"><text x="60" y="58" fill="#67e8f9" font-size="18">system.capabilities()</text><text x="60" y="88" fill="#64748b" font-size="13">balanced engineering + product + creative technology</text></g>
<g fill="none" stroke="#263247" stroke-width="2"><path d="M350 190H500"/><path d="M700 190H850"/><path d="M350 350H500"/><path d="M700 350H850"/></g>
