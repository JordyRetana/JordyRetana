<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="t d">
<title id="t">Animated developer capabilities</title><desc id="d">Animated nodes for frontend backend cloud and creative technology</desc>
<defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#020617"/><stop offset="1" stop-color="#111827"/></linearGradient><linearGradient id="g" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#22d3ee"/><stop offset=".5" stop-color="#8b5cf6"/><stop offset="1" stop-color="#f59e0b"/></linearGradient><filter id="glow"><feGaussianBlur stdDeviation="5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs>
<rect width="1200" height="360" rx="28" fill="url(#bg)"/><g stroke="#243244" stroke-width="2" fill="none"><path d="M270 180H455"/><path d="M745 180H930"/><path d="M600 90V270"/></g>
<circle cx="600" cy="180" r="72" fill="#0f172a" stroke="#8b5cf6" stroke-width="3"><animate attributeName="r" values="68;76;68" dur="4s" repeatCount="indefinite"/></circle><circle cx="600" cy="180" r="88" fill="none" stroke="url(#g)" stroke-width="2" stroke-dasharray="18 16"><animateTransform attributeName="transform" type="rotate" from="0 600 180" to="360 600 180" dur="14s" repeatCount="indefinite"/></circle>
<g font-family="ui-monospace,Menlo,Consolas,monospace" text-anchor="middle"><text x="600" y="171" fill="#f8fafc" font-size="22" font-weight="700">JORDY</text><text x="600" y="199" fill="#94a3b8" font-size="14">BUILD SYSTEM</text>
<g><circle cx="210" cy="180" r="60" fill="#071827" stroke="#22d3ee" stroke-width="2"><animate attributeName="opacity" values=".72;1;.72" dur="3s" repeatCount="indefinite"/></circle><text x="210" y="174" fill="#67e8f9" font-size="19" font-weight="700">FRONTEND</text><text x="210" y="198" fill="#94a3b8" font-size="12">UI • MOTION</text></g>
<g><circle cx="600" cy="70" r="55" fill="#151127" stroke="#a78bfa" stroke-width="2"><animate attributeName="opacity" values="1;.72;1" dur="3.5s" repeatCount="indefinite"/></circle><text x="600" y="64" fill="#c4b5fd" font-size="19" font-weight="700">BACKEND</text><text x="600" y="88" fill="#94a3b8" font-size="12">APIs • DATA</text></g>
<g><circle cx="990" cy="180" r="60" fill="#211806" stroke="#f59e0b" stroke-width="2"><animate attributeName="opacity" values=".72;1;.72" dur="4s" repeatCount="indefinite"/></circle><text x="990" y="174" fill="#fbbf24" font-size="19" font-weight="700">CLOUD</text><text x="990" y="198" fill="#94a3b8" font-size="12">DEPLOY • AUTO</text></g>
<g><circle cx="600" cy="290" r="55" fill="#22120f" stroke="#fb7185" stroke-width="2"><animate attributeName="opacity" values="1;.7;1" dur="4.5s" repeatCount="indefinite"/></circle><text x="600" y="284" fill="#fda4af" font-size="17" font-weight="700">CREATIVE</text><text x="600" y="307" fill="#94a3b8" font-size="12">3D • INTERACTIVE</text></g></g>
<g fill="#22d3ee" filter="url(#glow)"><circle r="5"><animateMotion dur="3s" repeatCount="indefinite" path="M270 180H455"/></circle><circle r="5" fill="#f59e0b"><animateMotion dur="3.7s" repeatCount="indefinite" path="M745 180H930"/></circle><circle r="5" fill="#a78bfa"><animateMotion dur="4.1s" repeatCount="indefinite" path="M600 90V126"/></circle><circle r="5" fill="#fb7185"><animateMotion dur="4.6s" repeatCount="indefinite" path="M600 234V270"/></circle></g>
</svg>