<svg xmlns="http://www.w3.org/2000/svg" width="720" height="760" viewBox="0 0 720 760" role="img" aria-labelledby="t d"><title id="t">Mobile current focus terminal</title><desc id="d">Vertical terminal-style current focus panel optimized for phones</desc><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#020617"/><stop offset="1" stop-color="#111827"/></linearGradient></defs><rect width="720" height="760" rx="34" fill="url(#bg)" stroke="#1e293b" stroke-width="2"/><g font-family="ui-monospace,Menlo,Consolas,monospace"><circle cx="38" cy="34" r="6" fill="#ef4444"/><circle cx="60" cy="34" r="6" fill="#f59e0b"/><circle cx="82" cy="34" r="6" fill="#22c55e"/><text x="110" y="40" fill="#64748b" font-size="14">jordy@dev:~/focus</text><text x="42" y="94" fill="#22d3ee" font-size="17">$ run focus --live</text><rect x="392" y="76" width="10" height="20" fill="#22d3ee"><animate attributeName="opacity" values="1;0;1" dur="1s" repeatCount="indefinite"/></rect><g font-size="15"><text x="42" y="150" fill="#cbd5e1">[01] Full-stack architecture</text><rect x="42" y="174" width="636" height="20" rx="10" fill="#172033"/><rect x="42" y="174" height="20" rx="10" fill="#22d3ee"><animate attributeName="width" values="170;500;390;590" dur="6s" repeatCount="indefinite"/></rect><text x="42" y="258" fill="#cbd5e1">[02] UI personality + motion</text><rect x="42" y="282" width="636" height="20" rx="10" fill="#172033"/><rect x="42" y="282" height="20" rx="10" fill="#8b5cf6"><animate attributeName="width" values="230;560;350;530" dur="7s" repeatCount="indefinite"/></rect><text x="42" y="366" fill="#cbd5e1">[03] Cloud + automation</text><rect x="42" y="390" width="636" height="20" rx="10" fill="#172033"/><rect x="42" y="390" height="20" rx="10" fill="#f59e0b"><animate attributeName="width" values="150;470;320;510" dur="6.5s" repeatCount="indefinite"/></rect><text x="42" y="474" fill="#cbd5e1">[04] Interactive + 3D software</text><rect x="42" y="498" width="636" height="20" rx="10" fill="#172033"/><rect x="42" y="498" height="20" rx="10" fill="#fb7185"><animate attributeName="width" values="190;540;360;570" dur="7.5s" repeatCount="indefinite"/></rect></g><g transform="translate(42 590)"><rect width="636" height="100" rx="20" fill="#0b1220" stroke="#1e293b"/><text x="24" y="34" fill="#a78bfa" font-size="14">current.status</text><text x="24" y="64" fill="#f8fafc" font-size="15">building useful, polished software</text></g></g></svg>