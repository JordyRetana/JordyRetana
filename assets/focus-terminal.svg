<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="440" viewBox="0 0 1200 440" role="img" aria-labelledby="t d">
<title id="t">Animated current focus terminal</title><desc id="d">Terminal-style animated current focus panel with improved spacing</desc>
<defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#020617"/><stop offset="1" stop-color="#111827"/></linearGradient></defs>
<rect width="1200" height="440" rx="30" fill="url(#bg)" stroke="#1e293b" stroke-width="2"/>
<g font-family="ui-monospace,Menlo,Consolas,monospace">
  <circle cx="40" cy="34" r="6" fill="#ef4444"/><circle cx="60" cy="34" r="6" fill="#f59e0b"/><circle cx="80" cy="34" r="6" fill="#22c55e"/>
  <text x="108" y="40" fill="#64748b" font-size="14">jordy@dev:~/current-focus</text>
  <text x="48" y="92" fill="#22d3ee" font-size="17">$ run focus --live</text>
  <rect x="1010" y="74" width="11" height="21" fill="#22d3ee"><animate attributeName="opacity" values="1;0;1" dur="1s" repeatCount="indefinite"/></rect>
  <g font-size="16">
    <text x="48" y="146" fill="#cbd5e1">[01] Full-stack architecture</text>
    <rect x="48" y="164" width="1040" height="18" rx="9" fill="#172033"/><rect x="48" y="164" height="18" rx="9" fill="#22d3ee"><animate attributeName="width" values="300;780;620;920" dur="6s" repeatCount="indefinite"/></rect>
    <text x="48" y="218" fill="#cbd5e1">[02] UI personality + motion</text>
    <rect x="48" y="236" width="1040" height="18" rx="9" fill="#172033"/><rect x="48" y="236" height="18" rx="9" fill="#8b5cf6"><animate attributeName="width" values="380;900;580;840" dur="7s" repeatCount="indefinite"/></rect>
    <text x="48" y="290" fill="#cbd5e1">[03] Cloud + automation</text>
    <rect x="48" y="308" width="1040" height="18" rx="9" fill="#172033"/><rect x="48" y="308" height="18" rx="9" fill="#f59e0b"><animate attributeName="width" values="260;720;500;820" dur="6.5s" repeatCount="indefinite"/></rect>
    <text x="48" y="362" fill="#cbd5e1">[04] Interactive + 3D software</text>
    <rect x="48" y="380" width="1040" height="18" rx="9" fill="#172033"/><rect x="48" y="380" height="18" rx="9" fill="#fb7185"><animate attributeName="width" values="340;860;560;940" dur="7.5s" repeatCount="indefinite"/></rect>
  </g>
</g>
</svg>