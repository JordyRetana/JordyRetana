<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-labelledby="t d"><title id="t">Animated current focus terminal</title><desc id="d">Terminal-style animated current focus panel</desc><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#020617"/><stop offset="1" stop-color="#111827"/></linearGradient></defs><rect width="1200" height="300" rx="28" fill="url(#bg)" stroke="#1e293b"/><g font-family="ui-monospace,Menlo,Consolas,monospace"><circle cx="40" cy="34" r="6" fill="#ef4444"/><circle cx="60" cy="34" r="6" fill="#f59e0b"/><circle cx="80" cy="34" r="6" fill="#22c55e"/><text x="105" y="40" fill="#64748b" font-size="14">jordy@dev:~/current-focus</text><text x="48" y="92" fill="#22d3ee" font-size="17">$ run focus --live</text><g font-size="17"><text x="48" y="136" fill="#cbd5e1">[01] Full-stack architecture</text><rect x="340" y="121" width="650" height="18" rx="9" fill="#172033"/><rect x="340" y="121" height="18" rx="9" fill="#22d3ee"><animate attributeName="width" values="180;520;420;600" dur="6s" repeatCount="indefinite"/></rect><text x="48" y="176" fill="#cbd5e1">[02] UI personality + motion</text><rect x="340" y="161" width="650" height="18" rx="9" fill="#172033"/><rect x="340" y="161" height="18" rx="9" fill="#8b5cf6"><animate attributeName="width" values="260;610;390;560" dur="7s" repeatCount="indefinite"/></rect><text x="48" y="216" fill="#cbd5e1">[03] Cloud + automation</text><rect x="340" y="201" width="650" height="18" rx="9" fill="#172033"/><rect x="340" y="201" height="18" rx="9" fill="#f59e0b"><animate attributeName="width" values="150;480;330;540" dur="6.5s" repeatCount="indefinite"/></rect><text x="48" y="256" fill="#cbd5e1">[04] Interactive + 3D software</text><rect x="340" y="241" width="650" height="18" rx="9" fill="#172033"/><rect x="340" y="241" height="18" rx="9" fill="#fb7185"><animate attributeName="width" values="220;560;370;610" dur="7.5s" repeatCount="indefinite"/></rect></g><rect x="1018" y="76" width="12" height="22" fill="#22d3ee"><animate attributeName="opacity" values="1;0;1" dur="1s" repeatCount="indefinite"/></rect></g></svg>